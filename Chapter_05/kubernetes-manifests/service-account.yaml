# ServiceAccount with IRSA (IAM Roles for Service Accounts)
# The annotation links this Kubernetes ServiceAccount to an AWS IAM role
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-api
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/web-api-irsa-role
