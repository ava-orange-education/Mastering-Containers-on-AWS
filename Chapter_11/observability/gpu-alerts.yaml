# Prometheus Alerting Rules for GPU Workloads
# Book: Mastering Container Architectures on AWS - Chapter 11
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-alerts
  namespace: monitoring
spec:
  groups:
    - name: gpu-health
      rules:
        - alert: GPUTemperatureHigh
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU temperature above 85°C on {{ $labels.gpu }}"

        - alert: GPUMemoryAlmostFull
          expr: DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_FREE > 0.95
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU memory usage above 95% on {{ $labels.gpu }}"

        - alert: GPUIdleButAllocated
          expr: DCGM_FI_DEV_GPU_UTIL < 5 and on(pod) kube_pod_container_resource_limits{resource="nvidia_com_gpu"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "GPU allocated but idle for 30+ minutes (wasting cost)"

        - alert: GPUXidError
          expr: DCGM_FI_DEV_XID_ERRORS > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "GPU XID error detected on {{ $labels.gpu }} - potential hardware issue"
