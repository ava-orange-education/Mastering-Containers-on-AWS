# PyTorchJob - Distributed Training on EKS
# Uses Kubeflow Training Operator for multi-worker data-parallel training
# Book: Mastering Container Architectures on AWS - Chapter 11
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: resnet-distributed-training
  namespace: ml-training
spec:
  elasticPolicy:
    rdzvBackend: c10d
    minReplicas: 2
    maxReplicas: 4
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: pytorch-training
        spec:
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          containers:
            - name: pytorch
              image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ml-training:1.0.0
              command:
                - python
                - -m
                - torch.distributed.run
                - --nproc_per_node=4
                - train.py
                - --epochs=50
                - --batch-size=256
                - --checkpoint-dir=/checkpoints
              resources:
                limits:
                  nvidia.com/gpu: 4
                  cpu: "16"
                  memory: 64Gi
              volumeMounts:
                - name: checkpoints
                  mountPath: /checkpoints
                - name: training-data
                  mountPath: /data
          volumes:
            - name: checkpoints
              persistentVolumeClaim:
                claimName: training-checkpoints
            - name: training-data
              persistentVolumeClaim:
                claimName: training-data
    Worker:
      replicas: 3
      restartPolicy: OnFailure
      template:
        spec:
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          containers:
            - name: pytorch
              image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ml-training:1.0.0
              command:
                - python
                - -m
                - torch.distributed.run
                - --nproc_per_node=4
                - train.py
                - --epochs=50
                - --batch-size=256
                - --checkpoint-dir=/checkpoints
              resources:
                limits:
                  nvidia.com/gpu: 4
                  cpu: "16"
                  memory: 64Gi
              volumeMounts:
                - name: checkpoints
                  mountPath: /checkpoints
            - name: training-data
              mountPath: /data
          volumes:
            - name: checkpoints
              persistentVolumeClaim:
                claimName: training-checkpoints
            - name: training-data
              persistentVolumeClaim:
                claimName: training-data
