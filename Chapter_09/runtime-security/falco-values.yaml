# Helm values for Falco runtime security
# Install: helm install falco falcosecurity/falco -f falco-values.yaml -n falco-system
# Book: Mastering Container Architectures on AWS - Chapter 9
falco:
  rules_file:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d
  json_output: true
  log_level: info

# Send alerts to CloudWatch via Falcosidekick
falcosidekick:
  enabled: true
  config:
    aws:
      cloudwatchlogs:
        loggroup: /eks/falco-alerts
        logstream: runtime-security
        region: us-east-1
    slack:
      webhookurl: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      minimumpriority: "warning"

# Custom rules for container threats
customRules:
  custom-rules.yaml: |
    - rule: Shell Spawned in Container
      desc: Detect shell process started in container (potential compromise)
      condition: >
        spawned_process and container and
        proc.name in (bash, sh, zsh, dash) and
        not proc.pname in (cron, entrypoint.sh)
      output: >
        Shell spawned in container
        (user=%user.name container=%container.name image=%container.image.repository
         command=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING

    - rule: Sensitive File Access
      desc: Detect reads of sensitive files in containers
      condition: >
        open_read and container and
        fd.name in (/etc/shadow, /etc/passwd, /proc/self/environ)
      output: >
        Sensitive file accessed in container
        (file=%fd.name user=%user.name container=%container.name)
      priority: WARNING
