# SecretProviderClass for AWS Secrets Manager integration with EKS
# Uses Secrets Store CSI Driver to mount secrets as files or env vars
# Book: Mastering Container Architectures on AWS - Chapter 9
apiVersion: secrets-store.csi.x]8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-secrets
  namespace: production
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "production/database-credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db-username
          - path: password
            objectAlias: db-password
      - objectName: "/production/api-key"
        objectType: "ssmparameter"
  # Sync to Kubernetes Secret for use as env vars
  secretObjects:
    - secretName: app-secrets-k8s
      type: Opaque
      data:
        - objectName: db-username
          key: DATABASE_USERNAME
        - objectName: db-password
          key: DATABASE_PASSWORD
