# ============================================================================
# Docker Compose for Local Development
# Book: Mastering Container Architectures on AWS - Chapter 1
#
# Demonstrates Factor IV (Backing Services): Database and cache are attached
# resources configured via URLs. Same container image runs in dev and prod.
# ============================================================================
version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - SERVICE_NAME=twelve-factor-app
      - APP_VERSION=1.0.0-dev
      - DATABASE_URL=postgresql://appuser:secret@db:5432/appdb
      - CACHE_URL=redis://cache:6379
      - LOG_LEVEL=DEBUG
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Factor IV: Database as a backing service (swappable via URL)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Factor IV: Cache as a backing service (swappable via URL)
  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
