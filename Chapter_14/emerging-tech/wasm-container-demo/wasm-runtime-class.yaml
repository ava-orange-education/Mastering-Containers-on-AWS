# RuntimeClass for WebAssembly workloads on Kubernetes
# Requires a WASM-capable container runtime (e.g., containerd with runwasi)
# Book: Mastering Container Architectures on AWS - Chapter 14
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: wasmtime
handler: wasmtime
scheduling:
  nodeSelector:
    runtime/wasmtime: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wasm-demo
  namespace: emerging-tech
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wasm-demo
  template:
    metadata:
      labels:
        app: wasm-demo
    spec:
      runtimeClassName: wasmtime
      containers:
        - name: wasm
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/wasm-demo:1.0.0
          resources:
            requests:
              cpu: 10m      # WASM is extremely lightweight
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
