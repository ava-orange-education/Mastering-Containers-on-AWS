# EKS Cluster with Local Zone Node Group
# Book: Mastering Container Architectures on AWS - Chapter 13
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: edge-enabled-cluster
  region: us-east-1
  version: "1.31"

managedNodeGroups:
  # Parent region nodes (backend services)
  - name: region-nodes
    instanceType: m6i.xlarge
    desiredCapacity: 3
    minSize: 2
    maxSize: 10
    privateNetworking: true
    labels:
      location: region

  # Local Zone nodes (latency-sensitive services)
  - name: local-zone-nodes
    instanceType: m6i.xlarge
    desiredCapacity: 2
    minSize: 1
    maxSize: 5
    availabilityZones: ["us-east-1-bos-1a"]  # Boston Local Zone
    privateNetworking: true
    labels:
      location: local-zone
      city: boston
